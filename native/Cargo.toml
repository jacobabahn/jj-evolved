[package]
name = "jj-evolved-helper"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "jj-evolved-helper"
path = "src/main.rs"

[dependencies]
jj-cli = { version = "=0.45.1", default-features = false, features = ["git"] }
jj-lib = { version = "=0.45.1" }
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
indexmap = "2.14.0"
itertools = "0.15.0"
pollster = "1.0.1"
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
