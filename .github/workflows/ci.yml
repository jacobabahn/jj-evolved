name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Each push to main gets its own group: a group holds only one pending run, so queued main commits would be dropped.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-jj
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check:architecture
      # No helper is built here, so every read goes through the jj CLI. The rust job covers the helper path.
      - run: bun test

  rust:
    name: Rust helper
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-jj
      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native
          # PR caches can't be shared with other PRs, and each is ~700 MB against a 10 GB repo limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The fidelity tests compare helper output with the real jj CLI. This also builds target/release/jj-evolved-helper.
      - run: cargo test --release --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: .
      # These tests skip when the helper is missing, so fail first rather than pass silently.
      - name: Helper vs CLI from the app
        working-directory: .
        run: |
          test -x native/target/release/jj-evolved-helper
          bun test tests/repository/jj-helper-real.test.ts
